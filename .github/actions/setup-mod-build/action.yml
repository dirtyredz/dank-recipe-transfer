name: Set up mod build
description: Shared Java and Gradle toolchain after checkout, selected by the mod's build profile
inputs:
  release:
    description: "'true' refuses a branch other than the profile's declared release branch"
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - id: profile
      shell: bash
      run: node .ci/scripts/build-profile.mjs outputs
    - if: inputs.release == 'true'
      shell: bash
      run: node .ci/scripts/build-profile.mjs check-release-branch
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: ${{ steps.profile.outputs.java }}
    # Only the maintenance branch (main) and the profile's release branch write the shared cache.
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-read-only: ${{ steps.profile.outputs.cache-write != 'true' }}
