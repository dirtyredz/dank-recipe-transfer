name: CI
on:
  push:
    branches: ['**']
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-mod-build
      - name: Check pushed range whitespace
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            git cat-file -e "$BEFORE^{commit}"
            git diff --check "$BEFORE" HEAD
          else
            # A new branch or manual run has no previous tip: check the whole tree.
            git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          fi
      - name: Verify
        run: node .ci/scripts/verify.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-jar
          path: build/ci/release/*.jar
          if-no-files-found: error
          retention-days: 7
