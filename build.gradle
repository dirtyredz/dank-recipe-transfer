plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

// Loader-qualified release name: <mod_id>-<minecraft>-neoforge-<mod_version>.jar
base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTests live in their own source set so they never reach the release jar.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

// -PwithViewers=jei,emi puts the optional viewers on the dev runtime (server GameTests included);
// -PwithPolymorph adds Polymorph. Release builds never bundle any of them.
def runtimeViewers = (project.findProperty('withViewers') ?: '').toString().split(',').collect { it.trim() }.findAll { it }
def runtimePolymorph = project.hasProperty('withPolymorph')

neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.gameTest)
    // Pure JUnit tests use Minecraft buffer types without a game bootstrap.
    addModdingDependenciesTo(sourceSets.test)

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // GameTests are enabled only here; the other runs load the classes but never register tests.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    // One mod, two source sets: ModDevGradle groups both outputs under this mod id in development.
    // The release jar is built from sourceSets.main only.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Sleeping Town (EMI)'
        url = 'https://repo.sleeping.town/'
        content { includeGroup 'dev.emi' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    mavenCentral()
}

dependencies {
    // Mandatory: Dank Storage. Never bundled.
    implementation("curse.maven:${dank_curse_id}") { transitive = false }

    // Optional integrations. Compile-only so the release jar never carries them.
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    compileOnly("dev.emi:emi-neoforge:${emi_version}") { transitive = false }
    compileOnly("curse.maven:${polymorph_curse_id}") { transitive = false }

    if (runtimeViewers.contains('jei')) {
        runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    }
    if (runtimeViewers.contains('emi')) {
        runtimeOnly("dev.emi:emi-neoforge:${emi_version}") { transitive = false }
    }
    if (runtimePolymorph) {
        runtimeOnly("curse.maven:${polymorph_curse_id}") { transitive = false }
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version, neo_version_range: neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
            dank_version_range     : dank_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') { into 'META-INF' }
    // Mixins are declared in neoforge.mods.toml ([[mixins]]), not the manifest.
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: 'gradle/gametest-world.gradle'

apply from: 'gradle/verify-release-jar.gradle'
